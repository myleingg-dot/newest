name: Build PhantomDemo IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15-intel
    env:
      APP_ID: com.demo.phantomdemo
      APP_NAME: PhantomDemo
      IPA_NAME: PhantomDemo.ipa

    steps:
      - uses: actions/checkout@v4

      - name: Verify prebuilt web assets are committed
        run: |
          test -f www/index.html || { echo "::error::www/index.html missing - commit the www folder first"; exit 1; }
          test -f www/app.js || { echo "::error::www/app.js missing - run npm run build and commit www"; exit 1; }
          test -f www/styles.css || { echo "::error::www/styles.css missing - run npm run build and commit www"; exit 1; }
          test -f www/icon-1024.png || { echo "::error::www/icon-1024.png missing - required for AppIcon"; exit 1; }
          ls -la www

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Verify committed Capacitor identity
        run: |
          node -e '
            const c = require("./capacitor.config.json");
            if (c.appId !== process.env.APP_ID || c.appName !== process.env.APP_NAME) {
              console.error("capacitor.config.json does not match workflow identity", c.appId, c.appName);
              process.exit(1);
            }
            console.log("Identity OK:", c.appId, c.appName);
          '

      - name: Scaffold / sync Capacitor iOS project
        run: |
          test -d ios || npx cap add ios
          npx cap sync ios

      - name: Apply supplied app icon to iOS project
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          appicons = list(Path('ios').rglob('AppIcon.appiconset'))
          if len(appicons) != 1:
              raise SystemExit(f'Expected one iOS AppIcon.appiconset, found {len(appicons)}')
          target = appicons[0]
          shutil.copyfile('www/icon-1024.png', target / 'AppIcon-1024.png')
          contents = {
              'images': [{'filename': 'AppIcon-1024.png', 'idiom': 'universal', 'platform': 'ios', 'size': '1024x1024'}],
              'info': {'author': 'xcode', 'version': 1},
          }
          (target / 'Contents.json').write_text(json.dumps(contents, indent=2) + '\n')
          PY

      - name: Lock display name and portrait orientation
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName $APP_NAME" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST"

      - name: Build unsigned archive
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            archive

      - name: Package into ${{ env.IPA_NAME }}
        run: |
          APP=$(find ios/App/build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "app bundle: $APP"
          test -n "$APP" || { echo "::error::no .app produced by xcodebuild archive"; exit 1; }
          rm -rf Payload "$IPA_NAME"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$IPA_NAME" Payload
          ls -lh "$IPA_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomDemo-IPA
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-${{ github.run_number }}-${{ github.run_attempt }}
          name: PhantomDemo IPA (run ${{ github.run_number }})
          files: ${{ env.IPA_NAME }}
          fail_on_unmatched_files: true
          generate_release_notes: true
